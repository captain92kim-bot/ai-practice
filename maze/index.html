<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>우사기 미로찾기</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; overflow:hidden; }
  body {
    display:flex; flex-direction:column;
    font-family: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color:#35506b;
    background:
      radial-gradient(circle at 20% 15%, #fff 0 6px, transparent 7px) 0 0/60px 60px,
      radial-gradient(circle at 70% 60%, #e6f5ff 0 5px, transparent 6px) 0 0/60px 60px,
      linear-gradient(170deg, #7fc8ff 0%, #a9deff 55%, #d9f2ff 100%);
    touch-action:none; user-select:none; -webkit-user-select:none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px 14px;
    padding:8px 10px 4px;
  }
  h1 { margin:0; font-size:clamp(18px,4.5vw,26px); }
  .levels { display:flex; gap:6px; }
  .lv, #newBtn {
    border:3px solid #fff; border-radius:999px; padding:5px 14px; font:inherit; font-size:15px;
    background:#fff; color:#2f7fb8; cursor:pointer; box-shadow:0 2px 0 #a9d4f2;
  }
  .lv.on { background:#4aa8e8; color:#fff; box-shadow:0 2px 0 #2f7fb8; }
  #newBtn { background:#ffd966; color:#35506b; box-shadow:0 2px 0 #e0b63a; }
  .stat { font-size:18px; background:#fff; border-radius:999px; padding:3px 14px; box-shadow:0 2px 0 #a9d4f2; min-width:92px; text-align:center; }
  #stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:4px 8px 8px; }
  #wrap { width:100%; height:100%; position:relative; }
  #c { position:absolute; inset:0; width:100%; height:100%; border-radius:18px; box-shadow:0 4px 14px rgba(50,120,190,.35); }
  #dpad { display:none; position:absolute; left:10px; bottom:10px; width:132px; height:132px; opacity:.6; }
  @media (pointer:coarse) { #dpad { display:block; } }
  #dpad button { position:absolute; width:44px; height:44px; border:none; border-radius:50%; background:#fff; color:#4aa8e8; font-size:20px; box-shadow:0 2px 0 #a9d4f2; }
  #dpad .u { left:44px; top:0; } #dpad .d { left:44px; bottom:0; }
  #dpad .l { left:0; top:44px; } #dpad .r { right:0; top:44px; }
  #win {
    position:absolute; inset:0; display:none; align-items:center; justify-content:center; z-index:5;
    background:rgba(228,244,255,.88); border-radius:18px;
  }
  #win.show { display:flex; }
  .card { background:#fff; border:5px solid #8fc8f0; border-radius:28px; padding:22px 26px; text-align:center; max-width:88%; animation:pop .5s cubic-bezier(.3,1.6,.5,1); }
  .card h2 { margin:6px 0; font-size:clamp(22px,6vw,32px); color:#2a8bd1; }
  .card p { margin:4px 0 12px; font-size:clamp(16px,4vw,20px); }
  .card button { font:inherit; font-size:17px; border:none; border-radius:999px; padding:8px 22px; margin:3px; background:#4aa8e8; color:#fff; box-shadow:0 3px 0 #2f7fb8; cursor:pointer; }
  .card button.alt { background:#7ed67f; box-shadow:0 3px 0 #46a95a; }
  #winCanvas { width:min(300px,72vw); height:auto; display:block; margin:0 auto; position:static; }
  .dancetxt { font-size:clamp(14px,3.6vw,17px); color:#4aa8e8; margin-bottom:6px; }
  @keyframes pop { from { transform:scale(.3); opacity:0; } to { transform:scale(1); opacity:1; } }
  .conf { position:absolute; top:-30px; font-size:24px; pointer-events:none; animation:fall linear forwards; z-index:6; }
  .spark { position:fixed; font-size:22px; pointer-events:none; z-index:7; animation:rise 1s ease-out forwards; }
  @keyframes rise { from { transform:translateY(0) scale(.6); opacity:1; } to { transform:translateY(-50px) scale(1.4); opacity:0; } }
  @keyframes fall { to { transform:translateY(110vh) rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>🌸 우사기 미로찾기</h1>
  <div class="levels">
    <button class="lv" data-lv="easy">쉬움</button>
    <button class="lv on" data-lv="normal">보통</button>
    <button class="lv" data-lv="hard">어려움</button>
  </div>
  <span class="stat" id="time">⏱ 0.0초</span>
  <span class="stat" id="candyStat">🍭 0/5</span>
  <button id="newBtn">새 미로</button>
</header>
<div id="stage">
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="dpad">
      <button class="u" data-d="0">▲</button><button class="l" data-d="3">◀</button>
      <button class="r" data-d="1">▶</button><button class="d" data-d="2">▼</button>
    </div>
    <div id="win">
      <div class="card">
        <canvas id="winCanvas" width="480" height="400"></canvas>
        <div class="dancetxt">🎶 파자마 파티즈 댄스! 우와와 우와~ 타쿠타쿠 챠오! 🎶</div>
        <h2>야하! 탈출 성공! 🎉</h2>
        <p id="winText"></p>
        <button id="again">같은 난이도로 또!</button>
        <button id="harder" class="alt">다음 난이도로</button>
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
let ctx = canvas.getContext('2d');
let bg = null, candies = [];   // bg: 바닥·벽을 미리 그려 둔 레이어
const CANDY_N = 5;             // 미로에 떨어진 막대 캔디 개수
const wrap = document.getElementById('wrap');
const timeEl = document.getElementById('time');
const winEl = document.getElementById('win');
const LEVELS = { easy: 6, normal: 10, hard: 16 };   // 짧은 변 기준 칸 수
const ORDER = ['easy','normal','hard'];
let level = 'normal', cols, rows, cw, ch, W, H, grid, pos, goal, deco;
let started = false, won = false, t0 = 0, elapsed = 0, anim = null, moves = 0;

/* ---------- 미로 생성 (DFS) ---------- */
function generate(c, r) {
  const g = Array.from({length:r}, () => Array.from({length:c}, () => ({w:[1,1,1,1], v:0})));
  const D = [[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]];
  const st = [[0,0]]; g[0][0].v = 1;
  while (st.length) {
    const [x,y] = st[st.length-1];
    const o = D.filter(([dx,dy]) => g[y+dy] && g[y+dy][x+dx] && !g[y+dy][x+dx].v);
    if (!o.length) { st.pop(); continue; }
    const [dx,dy,a,b] = o[Math.random()*o.length|0];
    g[y][x].w[a] = 0; g[y+dy][x+dx].w[b] = 0; g[y+dy][x+dx].v = 1;
    st.push([x+dx,y+dy]);
  }
  return g;
}

/* ---------- 시작/크기 ---------- */
function start() {
  const dpr = window.devicePixelRatio || 1;
  W = wrap.clientWidth; H = wrap.clientHeight;
  canvas.width = W*dpr; canvas.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const cell = Math.min(W,H) / LEVELS[level];
  cols = Math.max(4, Math.round(W/cell)); rows = Math.max(4, Math.round(H/cell));
  cw = W/cols; ch = H/rows;                 // 화면 전체를 꽉 채움
  grid = generate(cols, rows);
  pos = {x:0, y:0, rx:0, ry:0}; goal = {x:cols-1, y:rows-1};
  started = won = false; elapsed = 0; moves = 0;
  timeEl.textContent = '⏱ 0.0초';
  winEl.classList.remove('show'); stopDance();
  // 바닥 장식(꽃/하트) 위치
  deco = [];
  for (let y=0;y<rows;y++) for (let x=0;x<cols;x++)
    if (!(x==0&&y==0) && !(x==goal.x&&y==goal.y)) {
      // 꽃 + 작은 하트(핑크/하양/노랑)를 여기저기 흩뿌림
      if (Math.random() < .16) deco.push({x,y,k:Math.random()*3|0, ox:.2+Math.random()*.6, oy:.2+Math.random()*.6});
      if (Math.random() < .5)  deco.push({x,y,k:3+(Math.random()*3|0), ox:.15+Math.random()*.7, oy:.15+Math.random()*.7, sz:.7+Math.random()*.6});
    }
  makeBushes();
  // 바닥·벽은 한 번만 그려 두고 매 프레임 복사해서 사용
  bg = document.createElement('canvas'); bg.width = canvas.width; bg.height = canvas.height;
  const real = ctx; ctx = bg.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  drawStatic(); ctx = real;
  placeCandy();
  draw();
}

/* 정답 경로(길이 하나뿐인 미로) 위 55% 지점에 캔디를 놓음 → 출구로 가려면 반드시 지나감 */
function placeCandy() {
  const key = (x,y) => y*cols+x, prev = new Map([[0,-1]]), q = [[0,0]];
  while (q.length) {
    const [x,y] = q.shift(); if (x==goal.x && y==goal.y) break;
    for (let d=0; d<4; d++) {
      if (grid[y][x].w[d]) continue;
      const nx = x+[0,1,0,-1][d], ny = y+[-1,0,1,0][d];
      if (prev.has(key(nx,ny))) continue;
      prev.set(key(nx,ny), key(x,y)); q.push([nx,ny]);
    }
  }
  const path = []; let k = key(goal.x,goal.y);
  while (k !== -1) { path.unshift(k); k = prev.get(k); }
  // 시작·출구 칸을 뺀 정답 경로를 5등분해 각 구간 가운데에 캔디를 놓음
  const inner = path.slice(1, -1), n = Math.min(CANDY_N, inner.length);
  candies = [];
  for (let i=0; i<n; i++) {
    const c = inner[Math.floor((i+.5)*inner.length/n)];
    candies.push({ x: c % cols, y: (c/cols)|0, got: false, ph: Math.random()*6.28 });
  }
  updateCandyHud();
}
const gotCount = () => candies.filter(c => c.got).length;
function updateCandyHud() {
  document.getElementById('candyStat').textContent = '🍭 ' + gotCount() + '/' + candies.length;
}
function pickCandy(cd) {
  cd.got = true; updateCandyHud();
  const r = canvas.getBoundingClientRect();
  for (let i=0;i<8;i++) {
    const e = document.createElement('div'); e.className = 'spark'; e.textContent = i%2 ? '✨' : '🍭';
    e.style.left = (r.left + (cd.x+.5)*cw + (Math.random()-.5)*cw) + 'px';
    e.style.top = (r.top + (cd.y+.5)*ch + (Math.random()-.5)*ch) + 'px';
    e.style.animationDelay = (i*.04)+'s';
    document.body.appendChild(e); setTimeout(() => e.remove(), 1200);
  }
}

/* 벽 위치를 따라 잎 덩어리(원)를 배치 — 한 번만 만들어 두고 매 프레임 재사용 */
let bushes = [];
function makeBushes() {
  bushes = [];
  const m = Math.min(cw,ch), r0 = m*.13, step = r0*1.1;
  const greens = ['#3da85a','#46b564','#2f9650','#58c46d'];
  const seg = (x1,y1,x2,y2) => {
    const len = Math.hypot(x2-x1,y2-y1), n = Math.max(1, Math.round(len/step));
    for (let i=0;i<=n;i++) {
      const t = i/n, j = (Math.random()-.5)*r0*.5;
      bushes.push({ x:x1+(x2-x1)*t + (y1==y2?0:j), y:y1+(y2-y1)*t + (y1==y2?j:0),
                    r:r0*(.85+Math.random()*.4), c:greens[Math.random()*greens.length|0] });
    }
  };
  for (let y=0;y<rows;y++) for (let x=0;x<cols;x++) {
    const w = grid[y][x].w, X=x*cw, Y=y*ch;
    if (w[0]) seg(X,Y,X+cw,Y);
    if (w[3]) seg(X,Y,X,Y+ch);
    if (x==cols-1 && w[1]) seg(X+cw,Y,X+cw,Y+ch);
    if (y==rows-1 && w[2]) seg(X,Y+ch,X+cw,Y+ch);
  }
}

/* ---------- 그리기 ---------- */
function flower(x,y,r,c) {
  ctx.fillStyle = c;
  for (let i=0;i<5;i++){ const a=i*Math.PI*2/5; ctx.beginPath(); ctx.arc(x+Math.cos(a)*r,y+Math.sin(a)*r,r*.7,0,7); ctx.fill(); }
  ctx.fillStyle = '#ffd966'; ctx.beginPath(); ctx.arc(x,y,r*.6,0,7); ctx.fill();
}
function heart(x,y,s,c) {
  ctx.fillStyle = c; ctx.beginPath();
  ctx.moveTo(x,y+s*.9);
  ctx.bezierCurveTo(x-s*1.6,y-s*.2,x-s*.6,y-s*1.1,x,y-s*.35);
  ctx.bezierCurveTo(x+s*.6,y-s*1.1,x+s*1.6,y-s*.2,x,y+s*.9); ctx.fill();
}
function ell(c,x,y,rx,ry,fill,rot=0,stroke) {
  c.beginPath(); c.ellipse(x,y,rx,ry,rot,0,7);
  if (fill) { c.fillStyle=fill; c.fill(); }
  if (stroke) { c.strokeStyle=stroke; c.lineWidth=.02; c.stroke(); }
}
/* 우사기 (직접 그린 캐릭터): c=ctx, (x,y)=몸 중심, s=전체 높이 */
function usagiOld(c, x, y, s, joy) {
  const o = '#6b4a3a';
  c.save(); c.translate(x,y); c.scale(s,s);
  c.lineWidth = .02;
  // 귀
  [[-.17,-.2],[.17,-.2]].forEach(([ex,ey],i) => {
    const rot = i? .18 : -.18;
    ell(c,ex,-.36,.075,.2,'#fff6bf',rot,o); ell(c,ex,-.34,.04,.13,'#ffc2d4',rot);
  });
  // 몸/머리
  ell(c,0,.08,.3,.3,'#fff6bf',0,o);
  // 팔 & 발
  ell(c,-.27,.12,.07,.05,'#fff6bf',-.5,o); ell(c,.27,.12,.07,.05,'#fff6bf',.5,o);
  ell(c,-.12,.38,.09,.05,'#fff6bf',0,o); ell(c,.12,.38,.09,.05,'#fff6bf',0,o);
  // 얼굴
  c.fillStyle = '#3b2a22';
  if (joy) { c.lineWidth=.025; c.strokeStyle='#3b2a22';
    [-.12,.12].forEach(ex=>{ c.beginPath(); c.arc(ex,0,.04,Math.PI,0); c.stroke(); }); }
  else { ell(c,-.12,0,.025,.035,'#3b2a22'); ell(c,.12,0,.025,.035,'#3b2a22'); }
  ell(c,-.19,.07,.05,.032,'#ffb0c8'); ell(c,.19,.07,.05,.032,'#ffb0c8');  // 볼
  // 입 (우사기 특유의 크게 벌린 입)
  c.beginPath(); c.moveTo(-.07,.06); c.quadraticCurveTo(0,.2,.07,.06); c.quadraticCurveTo(0,.09,-.07,.06);
  c.fillStyle='#d9506f'; c.fill(); c.lineWidth=.018; c.strokeStyle='#3b2a22'; c.stroke();
  c.restore();
}
/* 치이카와풍 친구(출구에서 기다림) */
function friendOld(c, x, y, s) {
  const o = '#6b4a3a';
  c.save(); c.translate(x,y); c.scale(s,s); c.lineWidth=.02;
  ell(c,-.17,-.2,.07,.07,'#fff',0,o); ell(c,.17,-.2,.07,.07,'#fff',0,o);
  ell(c,0,.1,.3,.28,'#fff',0,o);
  ell(c,-.12,0,.025,.035,'#3b2a22'); ell(c,.12,0,.025,.035,'#3b2a22');
  ell(c,-.19,.07,.05,.032,'#ffb0c8'); ell(c,.19,.07,.05,.032,'#ffb0c8');
  c.beginPath(); c.arc(0,.06,.03,0,Math.PI); c.strokeStyle='#3b2a22'; c.lineWidth=.02; c.stroke();
  c.restore();
}

/* ===== 우사기 (나무위키 외형 설명/이미지를 참고해 직접 그림) =====
   연노랑 털, 가늘고 긴 귀+분홍 속살, 이마의 처진 눈썹, 작은 눈,
   핑크 볼+빗금 3줄, 아랫입술 내민 작은 입, 굵은 검은 윤곽선, 달걀형 몸 */
const INK = '#1b1b1b', FUR = '#fbe6ae';
function egg(c) {
  c.beginPath(); c.moveTo(0,-.17);
  c.bezierCurveTo(.2,-.17,.37,-.04,.37,.15);
  c.bezierCurveTo(.37,.32,.2,.42,0,.42);
  c.bezierCurveTo(-.2,.42,-.37,.32,-.37,.15);
  c.bezierCurveTo(-.37,-.04,-.2,-.17,0,-.17); c.closePath();
}
function usagiVector(c, x, y, s, joy) {
  c.save(); c.translate(x,y+s*.04); c.scale(s,s);
  c.lineJoin = c.lineCap = 'round'; c.lineWidth = .03; c.strokeStyle = INK;
  // 귀 (뒤쪽)
  [[-.1,-.5,-.12],[.1,-.5,.16]].forEach(([ex,ey,r]) => {
    c.save(); c.translate(ex,-.3); c.rotate(r);
    ell(c,0,-.1,.05,.2,FUR); c.stroke();
    ell(c,0,-.08,.026,.15,'#ffb3c4'); c.restore();
  });
  // 꼬리(뒤)·발
  ell(c,-.13,.42,.07,.04,FUR); c.stroke(); ell(c,.13,.42,.07,.04,FUR); c.stroke();
  // 몸통
  egg(c); c.fillStyle = FUR; c.fill(); c.stroke();
  // 팔
  ell(c,-.37,.27,.05,.07,FUR,.3); c.stroke(); ell(c,.37,.27,.05,.07,FUR,-.3); c.stroke();
  // 처진 눈썹 (이마 곡선)
  c.lineWidth = .022;
  c.beginPath(); c.moveTo(-.31,.0); c.quadraticCurveTo(-.27,-.1,-.08,-.1); c.stroke();
  c.beginPath(); c.moveTo(.31,.0); c.quadraticCurveTo(.27,-.1,.08,-.1); c.stroke();
  // 눈
  c.lineWidth = .02;
  if (joy) { [-.14,.14].forEach(ex => { c.beginPath(); c.arc(ex,.08,.04,Math.PI*1.05,Math.PI*1.95); c.stroke(); }); }
  else [-.14,.14].forEach(ex => {
    ell(c,ex,.06,.045,.04,'#fff'); c.stroke();
    ell(c,ex+.005,.065,.022,.024,INK);
    ell(c,ex+.014,.055,.008,.008,'#fff');
  });
  // 볼 + 빗금 3줄
  ell(c,-.25,.14,.075,.05,'#ffb0c2'); ell(c,.25,.14,.075,.05,'#ffb0c2');
  c.strokeStyle = '#e8627f'; c.lineWidth = .012;
  [-.25,.25].forEach(bx => [-.03,0,.03].forEach(dx => {
    c.beginPath(); c.moveTo(bx+dx,.125); c.lineTo(bx+dx-.005,.155); c.stroke(); }));
  // 입: ω + 내민 아랫입술
  c.strokeStyle = INK; c.lineWidth = .018;
  c.beginPath(); c.moveTo(-.05,.135); c.quadraticCurveTo(-.025,.17,0,.14);
  c.quadraticCurveTo(.025,.17,.05,.135); c.stroke();
  if (joy) { c.beginPath(); c.arc(0,.17,.03,0,Math.PI); c.fillStyle='#e85d7f'; c.fill(); c.stroke(); }
  else { c.beginPath(); c.arc(0,.168,.018,.1,Math.PI-.1); c.stroke(); }
  c.restore();
}
/* 사용자가 제공한 우사기 이미지 (파일 안에 포함) — 흰 배경은 가장자리부터 투명하게 처리 */
let usagiImg = null;
function loadSprite(src, done) {
  const im = new Image();
  im.onload = () => {
    const w = im.width, h = im.height, cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const x = cv.getContext('2d'); x.drawImage(im, 0, 0);
    const d = x.getImageData(0, 0, w, h), p = d.data;
    const isBg = i => p[i] > 232 && p[i+1] > 232 && p[i+2] > 232;
    const seen = new Uint8Array(w*h), st = [];
    for (let i = 0; i < w; i++) st.push(i, (h-1)*w + i);
    for (let j = 0; j < h; j++) st.push(j*w, j*w + w-1);
    while (st.length) {
      const n = st.pop(); if (seen[n] || !isBg(n*4)) continue;
      seen[n] = 1; p[n*4+3] = 0;
      const px = n % w, py = (n/w)|0;
      if (px > 0) st.push(n-1); if (px < w-1) st.push(n+1);
      if (py > 0) st.push(n-w); if (py < h-1) st.push(n+w);
    }
    let x0=w, y0=h, x1=0, y1=0;
    for (let yy=0; yy<h; yy++) for (let xx=0; xx<w; xx++) if (p[(yy*w+xx)*4+3]) {
      if (xx<x0) x0=xx; if (xx>x1) x1=xx; if (yy<y0) y0=yy; if (yy>y1) y1=yy; }
    x.putImageData(d, 0, 0);
    const out = document.createElement('canvas');
    out.width = x1-x0+1; out.height = y1-y0+1;
    out.getContext('2d').drawImage(cv, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
    done(out);
  };

/* 발바닥 기준으로 점프(dy)·기울기(rot)·찌그러짐(sx,sy)을 줘서 그림 */
function drawSprite(c, img, x, y, hh, a) {
  const ww = hh * img.width / img.height;
  c.save();
  c.translate(x, y + hh/2);                 // 발 위치가 기준점
  if (a) { c.translate(0, a.dy||0); c.rotate(a.rot||0); c.scale(a.sx||1, a.sy||1); }
  c.drawImage(img, -ww/2, -hh, ww, hh);
  c.restore();
}
function usagi(c, x, y, s, joy, a) {
  if (!usagiImg) return usagiVector(c, x, y, s, joy);
  drawSprite(c, usagiImg, x, y + s*.03, s*.9, a);
}
/* 출구에서 기다리는 친구 (사용자 제공 이미지) */
function friend(c, x, y, s, a) {
  if (!goalImg) return friendVector(c, x, y, s);
  drawSprite(c, goalImg, x, y + s*.02, s*.95, a);
}
function friendVector(c, x, y, s) {
  c.save(); c.translate(x,y+s*.04); c.scale(s,s);
  c.lineJoin = c.lineCap = 'round'; c.lineWidth = .03; c.strokeStyle = INK;
  ell(c,-.2,-.12,.07,.07,'#fff'); c.stroke(); ell(c,.2,-.12,.07,.07,'#fff'); c.stroke();
  egg(c); c.fillStyle = '#fff'; c.fill(); c.stroke();
  ell(c,-.37,.27,.05,.07,'#fff',.3); c.stroke(); ell(c,.37,.27,.05,.07,'#fff',-.3); c.stroke();
  ell(c,-.13,.07,.02,.03,INK); ell(c,.13,.07,.02,.03,INK);
  ell(c,-.22,.14,.06,.04,'#ffb0c2'); ell(c,.22,.14,.06,.04,'#ffb0c2');
  c.lineWidth = .018; c.beginPath(); c.arc(0,.1,.03,.2,Math.PI-.2); c.stroke();
  c.restore();
}

function drawStatic() {
  ctx.clearRect(0,0,W,H);
  // 바닥
  ctx.fillStyle = 'rgba(232,246,255,.85)'; ctx.fillRect(0,0,W,H);
  // 체크 무늬 느낌
  for (let y=0;y<rows;y++) for (let x=0;x<cols;x++) if ((x+y)%2==0) {
    ctx.fillStyle='rgba(170,215,248,.45)'; ctx.fillRect(x*cw,y*ch,cw,ch);
  }
  const m = Math.min(cw,ch);
  deco.forEach(d => {
    const px=(d.x+d.ox)*cw, py=(d.y+d.oy)*ch;
    if (d.k==0) flower(px,py,m*.07,'#ffffff'); else if (d.k==1) flower(px,py,m*.07,'#ffe27a'); else if (d.k==2) flower(px,py,m*.07,'#ffc0d6');
    else heart(px,py,m*.09*d.sz, ['#ff9fc0','#ffffff','#ffd86b'][d.k-3]);   // 작고 귀여운 하트
  });
  // 벽: 수풀(울창한 덤불) — 어두운 윤곽 → 잎 덩어리 → 하이라이트 순서로 그림
  ctx.fillStyle = '#1f6b3a';
  bushes.forEach(b => { ctx.beginPath(); ctx.arc(b.x,b.y,b.r+Math.max(1.5,m*.03),0,7); ctx.fill(); });
  bushes.forEach(b => { ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill(); });
  ctx.fillStyle = 'rgba(190,255,170,.55)';
  bushes.forEach(b => { ctx.beginPath(); ctx.arc(b.x-b.r*.3,b.y-b.r*.3,b.r*.35,0,7); ctx.fill(); });
}

/* 막대 캔디 (직접 그림): (x,y)=머리 중심 기준 위치, s=크기 */
function drawCandy(c, x, y, s, tilt) {
  c.save(); c.translate(x,y); c.rotate(tilt||0);
  c.lineCap = 'round';
  c.strokeStyle = '#a7774f'; c.lineWidth = s*.1; c.beginPath(); c.moveTo(0,s*.1); c.lineTo(0,s*.5); c.stroke();
  c.strokeStyle = '#fff3dd'; c.lineWidth = s*.065; c.beginPath(); c.moveTo(0,s*.1); c.lineTo(0,s*.5); c.stroke();
  c.beginPath(); c.arc(0,-s*.08,s*.27,0,7);
  c.fillStyle = '#ff8fb5'; c.fill(); c.lineWidth = s*.05; c.strokeStyle = '#b8456e'; c.stroke();
  c.strokeStyle = '#fff'; c.lineWidth = s*.055; c.beginPath();
  for (let a=0; a<=Math.PI*5; a+=.3) { const r = s*.02 + a*s*.0165; c.lineTo(Math.cos(a)*r, -s*.08+Math.sin(a)*r); }
  c.stroke();
  c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.arc(-s*.14,-s*.2,s*.04,0,7); c.fill();
  c.restore();
}

function draw() {
  const m = Math.min(cw,ch);
  ctx.clearRect(0,0,W,H);
  if (bg) ctx.drawImage(bg,0,0,W,H);
  const t = performance.now();
  const shadow = (x, y, w) => { ctx.fillStyle = 'rgba(40,90,140,.18)'; ctx.beginPath(); ctx.ellipse(x,y,w,w*.28,0,0,7); ctx.fill(); };
  // 바닥의 막대 캔디 (둥실둥실 떠서 살짝 흔들림)
  candies.forEach(cd => {
    if (cd.got) return;
    const bob = Math.sin(t/260 + cd.ph)*m*.04;
    shadow((cd.x+.5)*cw, (cd.y+.5)*ch+m*.4, m*.17 - bob*.4);
    drawCandy(ctx,(cd.x+.5)*cw,(cd.y+.5)*ch-m*.12+bob,m*.95,-.25+Math.sin(t/520+cd.ph)*.12);
  });

  // 출구 친구: 숨쉬듯 흔들흔들, 가끔 폴짝. 우사기가 가까워지거나 클리어하면 신나서 계속 폴짝
  const gx = (goal.x+.5)*cw, gy = (goal.y+.5)*ch;
  const near = Math.hypot(pos.rx-goal.x, pos.ry-goal.y) < 4;
  const excited = near || won, period = excited ? 650 : 2400;
  const u = (t % period)/period, hop = u < .4 ? Math.sin(u/.4*Math.PI) : 0;
  const lean = excited ? Math.sign(pos.rx-goal.x || -1) * .07 : 0;
  shadow(gx, gy+m*.5, m*.3*(1-hop*.25));
  friend(ctx, gx, gy, m*1.05, {
    dy: -hop*m*(excited?.2:.1),
    rot: Math.sin(t/620)*.04 + lean + (excited ? Math.sin(t/140)*.05 : 0),
    sy: 1 + Math.sin(t/430)*.015 + hop*.06 - (u>=.4 && u<.5 ? .06 : 0),
    sx: 1 - hop*.04
  });

  // 우사기: 이동 중엔 통통 뛰며 진행 방향으로 기울고, 멈추면 숨쉬듯 흔들림
  const ux = (pos.rx+.5)*cw, uy = (pos.ry+.5)*ch;
  const s1 = Math.abs(Math.sin(fx.phase));
  let dy = -s1*fx.amp*m*.2, rot = fx.lean + Math.sin(fx.phase)*.05*fx.amp;
  let sy = 1 + fx.amp*(.1*s1 - .05*(1-s1)) + Math.sin(t/350)*.015*(1-fx.amp), sx = 1 - (sy-1)*.7;
  if (won) { dy = -Math.abs(Math.sin(t/170))*m*.2; rot = Math.sin(t/220)*.12; sy = 1.04; sx = .97; }
  shadow(ux, uy+m*.5, m*.3*(1 + dy/(m*.8)));
  usagi(ctx, ux, uy + m*.03, m*1.05, won, {dy, rot, sx, sy});
  // 주운 캔디는 우사기 옆에 부채꼴로 들고 다님 (우사기와 같이 통통)
  const n = gotCount();
  for (let i=0; i<n; i++)
    drawCandy(ctx, ux + m*.34, uy - m*.02 + dy, m*.5, .3 + (i-(n-1)/2)*.22);
}

/* ---------- 이동 ---------- */
/* ===== 파자마 파티즈 댄스 (클리어 카드) =====
   유튜브 안무 영상을 참고한 8박 구성 (한 박 ≈ 0.46초)
   1~4박 "우와와 우와": 양팔을 벌리듯 좌우로 크게 스윙 + 치이카와→우사기→하치와레 순서로 파도타기 점프
   5~6박 "타쿠타쿠": 한 손을 볼에 대고 고개를 갸웃(왼쪽 기울임) 하며 통통
   7박: 반대쪽으로 갸웃,  8박 "챠오!": 다 같이 키를 쭉 늘리며 번쩍 점프
   이미지 한 장이라 팔다리는 따로 못 움직여서, 몸통 기울임·점프·찌그러짐·파도 효과로 표현 */
let danceRaf = 0;
function stopDance() { cancelAnimationFrame(danceRaf); danceRaf = 0; }
function startDance() {
  stopDance();
  const cv = document.getElementById('winCanvas'), c = cv.getContext('2d');
  const DW = cv.width, DH = cv.height, BEAT = 460, T0 = performance.now();
  const pulse = (b, s, l) => { const x = (((b - s) % 8) + 8) % 8; return x < l ? Math.sin(x/l*Math.PI) : 0; };
  const notes = []; let rotS = 0;
  function frame(now) {
    const b = (now - T0)/BEAT, bb = b % 8;
    c.clearRect(0,0,DW,DH);
    if (trioImg) {
      const iw = trioImg.width, ih = trioImg.height;
      const sc = Math.min(DW*.9/iw, DH*.78/ih), w = iw*sc, h = ih*sc;
      const hop = [pulse(b,0,1)+pulse(b,4,1)*.8, pulse(b,1,1)+pulse(b,5,1)*.8, pulse(b,2,1)+pulse(b,6,1)*.8];
      const all = pulse(b,3,1) + pulse(b,7,1)*1.5;
      let rot = 0;
      if (bb < 4) rot = Math.sin(b*Math.PI)*.15;                       // 좌우 스윙
      else if (bb < 6) rot = -.17 + Math.sin(b*Math.PI*4)*.02;         // 볼에 손 + 갸웃
      else if (bb < 7) rot = .17;                                      // 반대쪽 갸웃
      rotS += (rot - rotS)*.25;
      const sy = 1 + all*.1, sx = 1 - all*.05;
      // 바닥 그림자
      c.fillStyle = 'rgba(60,120,180,.18)'; c.beginPath();
      c.ellipse(DW/2, DH*.93, w*.38*(1 - (all+Math.max(...hop))*.1), h*.05, 0, 0, 7); c.fill();
      c.save(); c.translate(DW/2, DH*.92); c.rotate(rotS); c.scale(sx, sy);
      const N = 96, cx = [.2,.5,.8];
      for (let i=0;i<N;i++) {            // 세로 띠마다 높이를 다르게 → 세 친구가 차례로 뛰는 파도
        const f = (i+.5)/N; let ws = 0, hs = 0;
        for (let k=0;k<3;k++) { const g = Math.exp(-Math.pow((f-cx[k])/.17,2)); ws += g; hs += g*hop[k]; }
        const off = -(hs/ws + all)*h*.13;
        c.drawImage(trioImg, i*iw/N, 0, iw/N+1, ih, -w/2 + i*w/N, -h + off, w/N+.8, h);
      }
      c.restore();
      // 떠오르는 음표
      if (Math.random() < .12) notes.push({x:DW*(.1+Math.random()*.8), y:DH*.7, v:.6+Math.random(), ch:'♪♫♬'[Math.random()*3|0], col:['#ff8fb5','#4aa8e8','#ffc83d'][Math.random()*3|0], a:1});
      c.font = '30px sans-serif';
      for (let i=notes.length-1;i>=0;i--) { const n = notes[i]; n.y -= n.v*1.6; n.a -= .008;
        if (n.a <= 0) { notes.splice(i,1); continue; }
        c.globalAlpha = n.a; c.fillStyle = n.col; c.fillText(n.ch, n.x + Math.sin(n.y/20)*8, n.y); }
      c.globalAlpha = 1;
    }
    danceRaf = requestAnimationFrame(frame);
  }
  danceRaf = requestAnimationFrame(frame);
}

/* 항상 도는 애니메이션 루프: 위치 보간 + 점프 위상 갱신 후 다시 그림 */
let lastTs = 0;
const fx = { phase: 0, amp: 0, lean: 0 };
function frame(ts) {
  const dt = Math.min(.05, (ts - lastTs)/1000 || .016); lastTs = ts;
  if (pos && grid) {
    const dx = pos.x-pos.rx, dyy = pos.y-pos.ry, dist = Math.hypot(dx,dyy);
    const k = 1 - Math.exp(-dt*16);
    pos.rx += dx*k; pos.ry += dyy*k;
    if (dist < .01) { pos.rx = pos.x; pos.ry = pos.y; }
    const moving = dist > .03;
    fx.amp += ((moving?1:0) - fx.amp) * (1 - Math.exp(-dt*(moving?20:10)));
    if (moving) fx.phase += dt*22;
    else fx.phase += (Math.round(fx.phase/Math.PI)*Math.PI - fx.phase) * (1 - Math.exp(-dt*14));
    fx.lean += ((moving ? Math.sign(dx)*.16 : 0) - fx.lean) * (1 - Math.exp(-dt*12));
    draw();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function move(d) {
  if (won) return;
  if (grid[pos.y][pos.x].w[d]) return;
  if (!started) { started = true; t0 = performance.now(); tick(); }
  pos.x += [0,1,0,-1][d]; pos.y += [-1,0,1,0][d]; moves++;
  const cd = candies.find(c => !c.got && c.x==pos.x && c.y==pos.y);
  if (cd) pickCandy(cd);
  if (pos.x==goal.x && pos.y==goal.y) win();
}
function tick() {
  if (!started || won) return;
  elapsed = (performance.now()-t0)/1000;
  timeEl.textContent = '⏱ ' + elapsed.toFixed(1) + '초';
  requestAnimationFrame(tick);
}
function win() {
  won = true; elapsed = (performance.now()-t0)/1000;
  timeEl.textContent = '⏱ ' + elapsed.toFixed(1) + '초';
  document.getElementById('winText').textContent =
    `걸린 시간 ${elapsed.toFixed(1)}초 (${moves}걸음) · 캔디 ${gotCount()}/${candies.length}개를 친구에게 전달했어요! 🍭`;
  setTimeout(() => { winEl.classList.add('show'); startDance(); }, 350);
  const em = ['🌸','⭐','💖','🎉','🍓','✨'];
  for (let i=0;i<30;i++) {
    const e = document.createElement('div'); e.className='conf';
    e.textContent = em[i%em.length]; e.style.left = Math.random()*100+'vw';
    e.style.animationDuration = (2+Math.random()*2.5)+'s'; e.style.animationDelay = Math.random()*.8+'s';
    document.body.appendChild(e); setTimeout(()=>e.remove(),5500);
  }
}

/* ---------- 입력 ---------- */
const KEYS = {ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3,W:0,D:1,S:2,A:3};
document.addEventListener('keydown', e => { if (e.key in KEYS) { e.preventDefault(); move(KEYS[e.key]); } });
// 터치: 화면 위에서 드래그/스와이프하면 계속 이동
let tp = null;
wrap.addEventListener('touchstart', e => { tp = {x:e.touches[0].clientX, y:e.touches[0].clientY}; }, {passive:true});
wrap.addEventListener('touchmove', e => {
  e.preventDefault(); if (!tp) return;
  const t = e.touches[0], dx=t.clientX-tp.x, dy=t.clientY-tp.y, th = Math.min(cw,ch)*.5;
  if (Math.max(Math.abs(dx),Math.abs(dy)) < Math.min(th,28)) return;
  move(Math.abs(dx)>Math.abs(dy) ? (dx>0?1:3) : (dy>0?2:0));
  tp = {x:t.clientX, y:t.clientY};
}, {passive:false});
// 화면 방향 버튼
document.querySelectorAll('#dpad button').forEach(b =>
  b.addEventListener('pointerdown', e => { e.preventDefault(); move(+b.dataset.d); }));

document.querySelectorAll('.lv').forEach(b => b.onclick = () => setLevel(b.dataset.lv));
function setLevel(l) {
  level = l;
  document.querySelectorAll('.lv').forEach(b => b.classList.toggle('on', b.dataset.lv===l));
  start();
}
document.getElementById('newBtn').onclick = start;
document.getElementById('again').onclick = start;
document.getElementById('harder').onclick = () => setLevel(ORDER[Math.min(2, ORDER.indexOf(level)+1)]);
window.addEventListener('resize', () => { clearTimeout(window._r); window._r = setTimeout(start, 200); });

start();   // 열 때마다 새 미로
</script>
